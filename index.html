<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0b2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nitebop">
<title>Nitebop – Neon Night</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
  :root { --neon:#5ef2ff; --pink:#ff4fd8; --gold:#ffd84a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  html,body { margin:0; height:100%; overflow:hidden; background:#05051a; overscroll-behavior:none; touch-action:none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color:#fff; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #stage { position:relative; height:100%; width:100%; max-width:calc(100vh * 0.62); overflow:hidden; touch-action:none; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 16px); text-align:center; pointer-events:none; }
  .overlay.hidden { display:none; }
  .overlay button, .overlay .card, .overlay .interactive { pointer-events:auto; }
  .title { font-size: clamp(46px, 14vw, 72px); font-weight: 900; letter-spacing:2px; margin:0;
    background: linear-gradient(180deg,#fff 0%, var(--neon) 55%, var(--pink) 100%); -webkit-background-clip:text; background-clip:text; color:transparent;
    filter: drop-shadow(0 0 14px rgba(94,242,255,.55)); }
  .subtitle { opacity:.75; margin:4px 0 0; font-size:15px; letter-spacing:3px; text-transform:uppercase; }
  .tap { margin-top: 34vh; font-size: 22px; font-weight:700; animation: pulse 1.3s ease-in-out infinite; text-shadow:0 0 12px rgba(94,242,255,.9); }
  @keyframes pulse { 0%,100% { opacity:1; transform:scale(1);} 50% { opacity:.55; transform:scale(.96);} }
  .best { margin-top:10px; font-size:15px; opacity:.8; }
  .row { display:flex; gap:12px; margin-top:18px; justify-content:center; flex-wrap:wrap; }
  .btn { border:0; border-radius:16px; padding:12px 20px; font-size:16px; font-weight:800; color:#0b0b2b; cursor:pointer;
    background: linear-gradient(180deg,#9ff8ff, var(--neon)); box-shadow: 0 0 18px rgba(94,242,255,.55), inset 0 -3px 0 rgba(0,0,0,.18); }
  .btn.pink { background: linear-gradient(180deg,#ffa3ec, var(--pink)); box-shadow: 0 0 18px rgba(255,79,216,.55), inset 0 -3px 0 rgba(0,0,0,.18); }
  .btn.ghost { background: rgba(255,255,255,.08); color:#fff; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.25); }
  .btn:active { transform: translateY(2px) scale(.98); }
  .card { background: rgba(15,15,50,.72); border:1.5px solid rgba(94,242,255,.35); border-radius:22px; padding:22px 26px; min-width: 240px;
    box-shadow: 0 0 30px rgba(94,242,255,.18), inset 0 0 30px rgba(94,242,255,.06); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .card h2 { margin:0 0 12px; font-size:30px; color:#fff; text-shadow:0 0 14px rgba(255,79,216,.8); }
  .stats { display:grid; grid-template-columns: 1fr 1fr; gap: 10px 22px; margin: 8px 0 4px; }
  .stats .lbl { font-size:12px; letter-spacing:2px; text-transform:uppercase; opacity:.7; }
  .stats .val { font-size:34px; font-weight:900; }
  .newbest { color: var(--gold); font-weight:800; margin-top:6px; text-shadow:0 0 10px rgba(255,216,74,.8); }
  .hint { margin-top:16px; font-size:14px; opacity:.7; }
  #hud { position:absolute; left:0; right:0; top: calc(env(safe-area-inset-top) + 10px); display:flex; justify-content:space-between; align-items:center; padding: 0 12px; pointer-events:none; }
  .pill { pointer-events:auto; background: rgba(10,10,40,.55); border:1px solid rgba(255,255,255,.18); border-radius: 999px; padding:7px 12px; font-weight:800; font-size:15px; display:flex; align-items:center; gap:6px; color:#fff; }
  button.pill { cursor:pointer; font-family:inherit; }
  .coin { width:16px; height:16px; border-radius:50%; display:inline-block; background: radial-gradient(circle at 35% 35%, #fff6c0, var(--gold) 45%, #c48a00 100%); box-shadow:0 0 8px rgba(255,216,74,.8); }
  /* Shop */
  #shop { justify-content:flex-start; pointer-events:auto; background: rgba(5,5,26,.78); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  #shop h2 { margin: 30px 0 4px; font-size: 30px; text-shadow:0 0 14px rgba(94,242,255,.8); }
  #shopCoins { margin-bottom: 14px; }
  #skinGrid { display:grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; max-width: 360px; overflow-y:auto; touch-action: pan-y; padding: 4px; }
  .skin { background: rgba(255,255,255,.06); border:1.5px solid rgba(255,255,255,.14); border-radius:18px; padding:12px 8px 10px; display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer; font-family:inherit; color:#fff; }
  .skin.selected { border-color: var(--neon); box-shadow: 0 0 16px rgba(94,242,255,.45); }
  .skin.locked canvas { opacity:.55; }
  .skin canvas { position:static; width:64px; height:64px; }
  .skin .name { font-weight:800; font-size:14px; }
  .skin .price { font-size:13px; display:flex; align-items:center; gap:5px; opacity:.9; }
  .skin .soon { font-size:11px; font-weight:800; color:#0b0b2b; background: linear-gradient(90deg, var(--gold), #ff9d4a); padding:3px 8px; border-radius:999px; }
  .toast { position:absolute; left:50%; bottom: calc(env(safe-area-inset-bottom) + 30px); transform:translateX(-50%); background: rgba(10,10,40,.92); border:1px solid rgba(94,242,255,.5); padding:10px 16px; border-radius:14px; font-weight:700; font-size:14px; opacity:0; transition: opacity .25s; pointer-events:none; white-space:nowrap; }
  .toast.show { opacity:1; }
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="pill" id="hudCoins"><span class="coin"></span><span id="coinCount">0</span></div>
    <button class="pill" id="muteBtn" aria-label="Ton an/aus">🔇</button>
  </div>

  <div class="overlay" id="menu">
    <h1 class="title">Nitebop</h1>
    <p class="subtitle">Neon Night</p>
    <div class="tap">Tippen zum Starten</div>
    <div class="best">Bestwert: <b id="menuBest">0</b></div>
    <div class="row"><button class="btn pink" id="shopBtn">🛍️ Shop</button></div>
  </div>

  <div class="overlay hidden" id="over">
    <div class="card">
      <h2>Game Over</h2>
      <div class="stats">
        <div><div class="lbl">Punkte</div><div class="val" id="overScore">0</div></div>
        <div><div class="lbl">Bestwert</div><div class="val" id="overBest">0</div></div>
      </div>
      <div id="overCoins" class="hint" style="margin-top:6px"></div>
      <div id="newBest" class="newbest hidden">★ Neuer Rekord! ★</div>
      <div class="row">
        <button class="btn" id="againBtn">Nochmal</button>
        <button class="btn pink" id="overShopBtn">Shop</button>
      </div>
      <div class="hint">oder irgendwo tippen</div>
    </div>
  </div>

  <div class="overlay hidden" id="shop">
    <h2>Shop</h2>
    <div class="pill" id="shopCoins"><span class="coin"></span><span id="shopCoinCount">0</span> Münzen</div>
    <div id="skinGrid"></div>
    <div class="row"><button class="btn ghost" id="shopBack">← Zurück</button></div>
  </div>

  <div class="toast" id="toast"></div>
</div></div>

<script>
(() => {
'use strict';

/* =========================================================
   DATA: Skins (data-driven, add new skins here)
   type: 'coins'   -> unlock with in-game coins (price)
         'premium' -> real purchase later (productId for store SDK)
   ========================================================= */
const SKINS = [
  { id:'aqua',    name:'Aqua',      type:'coins',   price:0,   light:'#e9ffff', mid:'#5ef2ff', dark:'#0a5f8a', glow:'#5ef2ff', trail:'#5ef2ff' },
  { id:'bubble',  name:'Bubblegum', type:'coins',   price:25,  light:'#fff0fb', mid:'#ff6fd8', dark:'#8a0f6a', glow:'#ff4fd8', trail:'#ff8fe4' },
  { id:'lime',    name:'Limette',   type:'coins',   price:50,  light:'#f6ffe0', mid:'#9dff4f', dark:'#2f7a00', glow:'#9dff4f', trail:'#c4ff8a' },
  { id:'sunset',  name:'Sunset',    type:'coins',   price:100, light:'#fff4dc', mid:'#ff9d4a', dark:'#9a2a00', glow:'#ff7a3a', trail:'#ffb86b' },
  { id:'gold',    name:'Gold',      type:'coins',   price:200, light:'#fffbe0', mid:'#ffd84a', dark:'#8a5a00', glow:'#ffd84a', trail:'#ffe58a' },
  { id:'galaxy',  name:'Galaxy',    type:'premium', productId:'nitebop.skin.galaxy', light:'#f1e6ff', mid:'#8a5cff', dark:'#1a0a4a', glow:'#b48cff', trail:'#b48cff', rainbow:false, sparkle:true },
  { id:'rainbow', name:'Regenbogen',type:'premium', productId:'nitebop.skin.rainbow', light:'#ffffff', mid:'#ff4f4f', dark:'#4a0a2a', glow:'#ffffff', trail:'#ffffff', rainbow:true },
];

/* =========================================================
   STORAGE (localStorage wrapper, safe if unavailable)
   ========================================================= */
const Store = {
  key: 'nitebop.v1',
  legacyKeys: ['orbly.v1'],   // older save keys from before the rename; migrated once
  data: { best:0, coins:0, owned:['aqua'], skin:'aqua', muted:true },
  load() {
    try {
      let raw = localStorage.getItem(this.key);
      if (!raw) for (const k of this.legacyKeys) { const old = localStorage.getItem(k); if (old) { raw = old; localStorage.setItem(this.key, old); localStorage.removeItem(k); break; } }
      const d = JSON.parse(raw); if (d) Object.assign(this.data, d);
    } catch(e){} 
           if (!this.data.owned.includes('aqua')) this.data.owned.push('aqua');
           this.save(); },
  save() { try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch(e){} }
};
Store.load();

/* =========================================================
   WALLET / PURCHASES
   Wallet = in-game coins. Purchases = placeholder for a real
   store SDK (e.g. RevenueCat / StoreKit / Play Billing via a
   native wrapper). Replace Purchases.isAvailable + buy().
   ========================================================= */
const Wallet = {
  get coins() { return Store.data.coins; },
  add(n) { Store.data.coins += n; Store.save(); UI.updateCoins(); },
  spend(n) { if (Store.data.coins < n) return false; Store.data.coins -= n; Store.save(); UI.updateCoins(); return true; }
};
const Purchases = {
  isAvailable: false,                       // set true once a real SDK is wired up
  async buy(productId) { throw new Error('not_available'); },  // must resolve on success
  async restore() { return []; }            // returns owned productIds
};
const Skins = {
  get current() { return SKINS.find(s => s.id === Store.data.skin) || SKINS[0]; },
  owns(id) { return Store.data.owned.includes(id); },
  grant(id) { if (!this.owns(id)) Store.data.owned.push(id); Store.save(); },
  select(id) { if (this.owns(id)) { Store.data.skin = id; Store.save(); } },
  async acquire(skin) {
    if (this.owns(skin.id)) { this.select(skin.id); return 'selected'; }
    if (skin.type === 'coins') {
      if (!Wallet.spend(skin.price)) return 'insufficient';
      this.grant(skin.id); this.select(skin.id); return 'bought';
    }
    if (skin.type === 'premium') {
      if (!Purchases.isAvailable) return 'soon';
      try { await Purchases.buy(skin.productId); this.grant(skin.id); this.select(skin.id); return 'bought'; }
      catch(e) { return 'failed'; }
    }
  }
};

/* =========================================================
   AUDIO (WebAudio synth, muted until user enables)
   ========================================================= */
const Sound = {
  ctx:null,
  get muted() { return Store.data.muted; },
  unlock() { if (!this.ctx) { try { this.ctx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} }
             if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  tone(freq, dur, type='sine', vol=0.15, slide=0) {
    if (this.muted || !this.ctx) return;
    const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq+slide), t+dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t+dur+0.02);
  },
  flap()  { this.tone(520, 0.12, 'sine', 0.12, 260); },
  score() { this.tone(880, 0.09, 'triangle', 0.12); setTimeout(()=>this.tone(1320,0.12,'triangle',0.1),70); },
  coin()  { this.tone(1200, 0.07, 'square', 0.06); setTimeout(()=>this.tone(1800,0.12,'square',0.05),60); },
  hit()   { this.tone(220, 0.35, 'sawtooth', 0.12, -160); }
};

/* =========================================================
   CANVAS / SCALING
   World is defined in logical units: height = 800, width = aspect-based
   ========================================================= */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const stage = document.getElementById('stage');
const WORLD_H = 800;
let W = 400, scale = 1, dpr = 1;
const GROUND_H = 90;

let dprLimit = 2;   // overwritten from CFG.dprMax; lowered automatically on slow devices
function resize() {
  const r = stage.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, dprLimit);
  const cw = Math.round(r.width * dpr), ch = Math.round(r.height * dpr);
  if (canvas.width !== cw) canvas.width = cw;
  if (canvas.height !== ch) canvas.height = ch;
  scale = r.height / WORLD_H;
  W = r.width / scale;
  ctx.setTransform(scale*dpr, 0, 0, scale*dpr, 0, 0);
  ctx.imageSmoothingQuality = 'high';
  buildBackground();
  scoreCache.n = -1;
}
// offscreen canvas in device pixels for a w x h world-unit area
function makeLayer(w, h) {
  const k = scale * dpr, c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w * k)); c.height = Math.max(1, Math.ceil(h * k));
  const x = c.getContext('2d'); x.setTransform(k, 0, 0, k, 0, 0);
  return { c, x, w, h };
}

/* =========================================================
   BACKGROUND (procedural, parallax)
   ========================================================= */
let stars = [], skylineFar = null, skylineNear = null, skyLayer = null, groundLayer = null;
function rand(a,b){ return a + Math.random()*(b-a); }
function buildBackground() {
  stars = [];
  const n = Math.round(W * 0.28);
  for (let i=0;i<n;i++) stars.push({ x:rand(0,W), y:rand(0,WORLD_H-GROUND_H-120), r:rand(0.6,2.0), tw:rand(0,Math.PI*2), sp:rand(0.02,0.12) });
  const mk = (minH,maxH,minW,maxW) => { const arr=[]; let x=0; while (x < W+300) { const w=rand(minW,maxW); arr.push({x,w,h:rand(minH,maxH),win:Math.random()<0.6}); x+=w+rand(2,10);} return {arr,len:x}; };
  skylineFar = bakeSkyline(mk(60,170,30,70), '#2a1260', 'rgba(255,79,216,.35)');
  skylineNear = bakeSkyline(mk(40,120,40,90), '#170a3d', 'rgba(94,242,255,.45)');
  // sky gradient + moon: static, baked once per resize
  skyLayer = makeLayer(W, WORLD_H); const c = skyLayer.x;
  const g = c.createLinearGradient(0,0,0,WORLD_H);
  g.addColorStop(0,'#05051a'); g.addColorStop(0.45,'#1a0f4a'); g.addColorStop(0.8,'#3b1466'); g.addColorStop(1,'#5a1a6e');
  c.fillStyle = g; c.fillRect(0,0,W,WORLD_H);
  const mx = W*0.78, my = 140;
  const mg = c.createRadialGradient(mx,my,10,mx,my,110);
  mg.addColorStop(0,'rgba(255,220,255,.35)'); mg.addColorStop(1,'rgba(255,220,255,0)');
  c.fillStyle = mg; c.beginPath(); c.arc(mx,my,110,0,Math.PI*2); c.fill();
  c.fillStyle = '#ffe9fb'; c.beginPath(); c.arc(mx,my,34,0,Math.PI*2); c.fill();
  c.fillStyle = 'rgba(200,150,220,.35)'; c.beginPath(); c.arc(mx-10,my-6,7,0,Math.PI*2); c.arc(mx+12,my+10,5,0,Math.PI*2); c.fill();
  // ground body (gradient + horizon lines) baked; only the moving grid is drawn live
  groundLayer = makeLayer(W, GROUND_H); const gc = groundLayer.x;
  const gg = gc.createLinearGradient(0,0,0,GROUND_H);
  gg.addColorStop(0,'#1b0b45'); gg.addColorStop(1,'#07031a');
  gc.fillStyle = gg; gc.fillRect(0,0,W,GROUND_H);
  gc.strokeStyle = 'rgba(255,79,216,.55)'; gc.lineWidth = 1.5; gc.beginPath();
  for (let i=1;i<5;i++){ const yy = GROUND_H*Math.pow(i/5,1.6); gc.moveTo(0,yy); gc.lineTo(W,yy); }
  gc.stroke();
  bakeSprites();
}
// Skyline strip rendered once into an offscreen canvas (windows no longer flicker while scrolling)
function bakeSkyline(sk, fill, winColor) {
  let hmax = 0; for (const b of sk.arr) hmax = Math.max(hmax, b.h);
  const L = makeLayer(sk.len, hmax), c = L.x;
  c.fillStyle = fill;
  for (const b of sk.arr) c.fillRect(b.x, hmax-b.h, b.w, b.h);
  c.fillStyle = winColor;
  for (const b of sk.arr) {
    if (!b.win) continue;
    for (let wy = hmax-b.h+10; wy < hmax-10; wy += 16)
      for (let wx = b.x+6; wx < b.x+b.w-8; wx += 12)
        if (((wx*7+wy*13)|0) % 5 < 2) c.fillRect(wx, wy, 4, 6);
  }
  L.len = sk.len; L.hmax = hmax; return L;
}
// Re-usable sprites/gradients (no per-frame allocations while playing)
const Spr = {};
function bakeSprites() {
  const gl = makeLayer(52, 52), c = gl.x;
  const g = c.createRadialGradient(26,26,2,26,26,26);
  g.addColorStop(0,'rgba(255,216,74,.55)'); g.addColorStop(1,'rgba(255,216,74,0)');
  c.fillStyle = g; c.beginPath(); c.arc(26,26,26,0,Math.PI*2); c.fill();
  Spr.coinGlow = gl;
  Spr.coinBody = ctx.createRadialGradient(-4,-4,1,0,0,13);
  Spr.coinBody.addColorStop(0,'#fff8cc'); Spr.coinBody.addColorStop(0.5,'#ffd84a'); Spr.coinBody.addColorStop(1,'#b87a00');
  Spr.pillarBody = ctx.createLinearGradient(0,0,CFG.pipeW,0);
  Spr.pillarBody.addColorStop(0,'#14093a'); Spr.pillarBody.addColorStop(0.5,'#22105a'); Spr.pillarBody.addColorStop(1,'#0e062a');
  Spr.groundGlow = null; Spr.capCache = new Map(); Spr.ballCache = new Map();
}

/* =========================================================
   GAME STATE
   ========================================================= */
const G = {
  state:'menu',      // menu | play | over | shop
  t:0, score:0, runCoins:0, speed:0, dist:0,
  pipes:[], coins:[], particles:[], trail:[],
  ball:{ x:0, y:0, vy:0, r:22, rot:0, tilt:0, squash:0, bob:0, px:0, py:0, prot:0, ptilt:0, pop:1 },
  overAt:0, shake:0, flash:0, bgX:0, pBgX:0, pDist:0, tScroll:0, pTScroll:0, speedTarget:0
};

/* ALL TUNING IN ONE PLACE. Units: world units (screen height = 800), seconds.
   Jump apex = flap^2 / (2*gravity).  v0.1: 600^2/4000 = 90  ->  v0.2: 450^2/3500 = 58 (-36%) */
const CFG = {
  BUILD: 'v0.2-smooth',
  // physics
  gravity: 1750,       // was 2000
  flap: -450,          // was -600  (lower, shorter hop)
  maxFall: 820,        // was 950   (softer dive, easier to catch)
  // ball feel
  tiltUpMax: -0.42, tiltDownMax: 1.0, tiltPerVy: 1/650, tiltEase: 9,   // nose follows velocity, eased
  startX: 0.30, startXEase: 7,      // ball glides from menu position to play position
  popTime: 0.18,                    // spawn pop-in on restart
  // pace (speed eases toward its target instead of jumping per point)
  speed0: 185, speedMax: 300, speedGain: 3.5, speedEase: 2.0,
  // pipes
  gap0: 205, gapMin: 158, gapShrink: 1.6,   // gap -= per point
  maxDelta: 190,                            // max height change between consecutive gaps (was 220)
  spacing: 250, pipeW: 76, coinChance: 0.55,
  // engine
  step: 1/120,          // fixed physics step, rendering is interpolated -> identical at 60/90/120/144 Hz
  maxFrameDt: 0.05,     // longer hitches slow the game instead of teleporting it
  dprMax: 2,            // render resolution cap (2 is visually identical on phones, ~2x cheaper than 3)
  dprMin: 1.25,         // adaptive quality floor
};
dprLimit = CFG.dprMax;

function resetRun() {
  G.score = 0; G.runCoins = 0; G.speed = G.speedTarget = CFG.speed0; G.dist = G.pDist = 0; G.t = 0;
  G.pipes.length = 0; G.coins.length = 0; G.particles.length = 0; G.trail.length = 0;
  Object.assign(G.ball, { x: W*CFG.startX, y: WORLD_H*0.42, vy:0, rot:0, tilt:0, squash:0, pop:1 });
  snapBall();
  G.nextPipeX = W + 120;   // world x (pipes/coins live in world space; screen x = x - dist)
}
function snapBall() { const b = G.ball; b.px = b.x; b.py = b.y; b.prot = b.rot; b.ptilt = b.tilt; }
const ease = (k, dt) => 1 - Math.exp(-k*dt);   // frame-rate independent smoothing factor

function currentGap() { return Math.max(CFG.gapMin, CFG.gap0 - G.score*CFG.gapShrink); }

function spawnPipe(x) {
  const gap = currentGap();
  const top = 90, bottom = WORLD_H - GROUND_H - 90;
  // keep consecutive gaps reachable: limit vertical jump
  const prev = G.pipes.length ? G.pipes[G.pipes.length-1].gy : WORLD_H*0.42;
  const maxDelta = CFG.maxDelta;
  let gy = rand(Math.max(top + gap/2, prev - maxDelta), Math.min(bottom - gap/2, prev + maxDelta));
  const hue = (G.score*18 + G.pipes.length*25) % 360;
  G.pipes.push({ x, gy, gap, passed:false, hue });
  if (Math.random() < CFG.coinChance) G.coins.push({ x: x + CFG.pipeW/2, y: gy, taken:false, t:Math.random()*6 });
}

function flap() {
  const b = G.ball;
  b.vy = CFG.flap; b.squash = 1;
  Sound.flap();
  for (let i=0;i<6;i++) addParticle(b.x-b.r*0.6, b.y+b.r*0.5, rand(-140,-40), rand(20,140), 0.45, Skins.current.trail, rand(1.5,3.5));
}
// particle pool: no garbage while playing
const pPool = [];
function addParticle(x, y, vx, vy, life, c, r) {
  const p = pPool.pop() || {};
  p.x = p.px = x; p.y = p.py = y; p.vx = vx; p.vy = vy; p.life = p.max = life; p.c = c; p.r = r;
  G.particles.push(p);
}

function setState(s) {
  if ((s === 'menu' || s === 'shop') && (G.state === 'over' || G.state === 'dying')) resetRun();
  G.state = s;
  UI.show(s);
}

function startGame() {
  const b = G.ball, fromMenu = G.state === 'menu';
  const bx = b.x, by = b.y, brot = b.rot;
  resetRun();
  if (fromMenu) { b.x = bx; b.y = by; b.rot = brot; snapBall(); }   // no teleport: glide from menu spot
  else b.pop = 0;                                                    // restart: quick pop-in
  last = -1; acc = 0;                                                // no catch-up burst on the first frame
  setState('play'); flap();
}

function gameOver() {
  if (G.state !== 'play') return;
  Sound.hit();
  G.shake = 0.35; G.flash = 1;
  const isNew = G.score > Store.data.best;
  if (isNew) Store.data.best = G.score;
  Store.save();
  G.overAt = performance.now();
  G.state = 'dying';
  setTimeout(() => { UI.showOver(G.score, Store.data.best, isNew, G.runCoins); setState('over'); }, 550);
  const b = G.ball;
  for (let i=0;i<26;i++) { const a=rand(0,Math.PI*2), s=rand(80,380); addParticle(b.x, b.y, Math.cos(a)*s, Math.sin(a)*s, 0.8, Skins.current.glow, rand(2,4.5)); }
}

/* =========================================================
   UPDATE
   ========================================================= */
function snapshot() {   // previous state for render interpolation
  const b = G.ball; b.px = b.x; b.py = b.y; b.prot = b.rot; b.ptilt = b.tilt;
  G.pDist = G.dist; G.pBgX = G.bgX; G.pTScroll = G.tScroll;
  for (let i=0;i<G.particles.length;i++) { const p = G.particles[i]; p.px = p.x; p.py = p.y; }
}

function update(dt) {
  G.t += dt;
  const b = G.ball;
  // background drifts always (slow in menu)
  const bgSpeed = (G.state === 'play') ? G.speed : (G.state === 'dying' ? 0 : 60);
  G.bgX += bgSpeed * dt;
  G.tScroll += ((G.state==='play') ? G.speed : (G.state==='menu'||G.state==='shop' ? 140 : 0)) * dt;

  // particles (in-place compaction, recycled into pool)
  let n = 0;
  for (let i=0;i<G.particles.length;i++) {
    const p = G.particles[i];
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 600*dt; p.life -= dt;
    if (p.life > 0) G.particles[n++] = p; else pPool.push(p);
  }
  G.particles.length = n;

  b.squash = Math.max(0, b.squash - dt*5);
  b.pop = Math.min(1, b.pop + dt/CFG.popTime);
  G.shake = Math.max(0, G.shake - dt);
  G.flash = Math.max(0, G.flash - dt*3);

  if (G.state === 'menu' || G.state === 'shop') {
    b.x = W*0.5; b.y = WORLD_H*0.47 + Math.sin(G.t*2.6)*14; b.vy = Math.cos(G.t*2.6)*36;
    b.rot += dt*1.4; b.tilt += (0 - b.tilt)*ease(6, dt);
    pushTrail(dt);
    return;
  }
  if (G.state === 'over') { pushTrail(dt); return; }

  // physics (play + dying)
  b.vy = Math.min(CFG.maxFall, b.vy + CFG.gravity*dt);
  b.y += b.vy*dt;
  const floor = WORLD_H - GROUND_H - b.r;
  if (b.y > floor) { b.y = floor; b.vy = 0; if (G.state==='play') gameOver(); }
  if (b.y < -60) { b.y = -60; b.vy = Math.max(0,b.vy); }

  // smooth eased tilt with velocity
  const targetTilt = Math.max(CFG.tiltUpMax, Math.min(CFG.tiltDownMax, b.vy * CFG.tiltPerVy));
  b.tilt += (targetTilt - b.tilt) * ease(CFG.tiltEase, dt);
  if (G.state === 'play') {
    b.rot += (G.speed / b.r) * dt; // rolling
    b.x += (W*CFG.startX - b.x) * ease(CFG.startXEase, dt);
  }
  pushTrail(dt);

  if (G.state !== 'play') return;

  // world scroll (speed eases toward target -> no jerk on each point)
  G.speed += (G.speedTarget - G.speed) * ease(CFG.speedEase, dt);
  G.dist += G.speed*dt;
  const D = G.dist;
  for (let i=0;i<G.coins.length;i++) G.coins[i].t += dt;
  if (G.nextPipeX - D < W + 40) { spawnPipe(G.nextPipeX); G.nextPipeX += CFG.spacing; }
  n = 0; for (let i=0;i<G.pipes.length;i++) { const p = G.pipes[i]; if (p.x - D > -CFG.pipeW - 20) G.pipes[n++] = p; } G.pipes.length = n;
  n = 0; for (let i=0;i<G.coins.length;i++) { const c = G.coins[i]; if (c.x - D > -30 && !c.done) G.coins[n++] = c; } G.coins.length = n;

  // scoring + collision
  const hitR = b.r * 0.86;   // slightly forgiving
  for (const p of G.pipes) {
    const px = p.x - D;
    if (!p.passed && px + CFG.pipeW < b.x) {
      p.passed = true; G.score++; Sound.score();
      G.speedTarget = Math.min(CFG.speedMax, CFG.speed0 + G.score*CFG.speedGain);
    }
    const topH = p.gy - p.gap/2, botY = p.gy + p.gap/2;
    if (circleRect(b.x,b.y,hitR, px,-100,CFG.pipeW,topH+100) || circleRect(b.x,b.y,hitR, px,botY,CFG.pipeW,WORLD_H)) { gameOver(); break; }
  }
  for (const c of G.coins) {
    const cx = c.x - D;
    if (!c.taken && Math.hypot(cx-b.x, c.y-b.y) < b.r + 14) {
      c.taken = true; c.done = true; G.runCoins++; Wallet.add(1); Sound.coin();
      for (let i=0;i<10;i++){ const a=rand(0,Math.PI*2), s=rand(60,200); addParticle(cx, c.y, Math.cos(a)*s, Math.sin(a)*s-80, 0.5, '#ffd84a', rand(1.5,3)); }
    }
  }
}

// trail points stored in "trail space" (x + tScroll) so they can be interpolated; ring of reused objects
const tPool = [];
function pushTrail(dt) {
  const b = G.ball;
  let n = 0;
  for (let i=0;i<G.trail.length;i++) { const t = G.trail[i]; t.life -= dt; if (t.life > 0) G.trail[n++] = t; else tPool.push(t); }
  G.trail.length = n;
  if (G.state !== 'over' && G.state !== 'dying') { const t = tPool.pop() || {}; t.x = b.x + G.tScroll; t.y = b.y; t.life = 0.28; G.trail.push(t); }
}

function circleRect(cx,cy,r, rx,ry,rw,rh) {
  const nx = Math.max(rx, Math.min(cx, rx+rw)), ny = Math.max(ry, Math.min(cy, ry+rh));
  return (cx-nx)*(cx-nx) + (cy-ny)*(cy-ny) < r*r;
}

/* =========================================================
   RENDER
   ========================================================= */
// interpolated render state (alpha = fraction of the next physics step)
const R = { dist:0, bgX:0, ts:0, ball:{ x:0, y:0, vy:0, r:22, rot:0, tilt:0, squash:0 } };
const lerp = (a, b, t) => a + (b - a) * t;
function render(alpha = 1) {
  const b = G.ball, rb = R.ball;
  R.dist = lerp(G.pDist, G.dist, alpha); R.bgX = lerp(G.pBgX, G.bgX, alpha); R.ts = lerp(G.pTScroll, G.tScroll, alpha);
  rb.x = lerp(b.px, b.x, alpha); rb.y = lerp(b.py, b.y, alpha); rb.rot = lerp(b.prot, b.rot, alpha); rb.tilt = lerp(b.ptilt, b.tilt, alpha);
  rb.vy = b.vy; rb.r = b.r; rb.squash = b.squash;
  const pop = b.pop < 1 ? 1 - Math.pow(1 - b.pop, 3) : 1;   // easeOutCubic
  rb.r = b.r * pop;
  ctx.save();
  if (G.shake > 0) { const s = G.shake*18; ctx.translate(rand(-s,s), rand(-s,s)); }
  drawSky();
  drawPipes();
  drawCoins();
  drawGround();
  drawTrail(alpha);
  drawParticles(alpha);
  if (rb.r > 0.5) drawBall(ctx, rb, Skins.current);
  if (G.state === 'play' || G.state === 'dying') drawScore();
  ctx.restore();
  if (G.flash > 0) { ctx.globalAlpha = G.flash*0.55; ctx.fillStyle = '#fff'; ctx.fillRect(0,0,W,WORLD_H); ctx.globalAlpha = 1; }
}

function drawSky() {
  ctx.drawImage(skyLayer.c, 0, 0, W, WORLD_H);
  // stars (slow parallax + twinkle) - globalAlpha instead of per-star colour strings
  ctx.fillStyle = '#fff';
  for (const s of stars) {
    const x = ((s.x - R.bgX*s.sp) % W + W) % W;
    ctx.globalAlpha = 0.45 + 0.55*Math.sin(G.t*2 + s.tw);
    ctx.beginPath(); ctx.arc(x, s.y, s.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  drawSkyline(skylineFar, 0.18, WORLD_H-GROUND_H);
  drawSkyline(skylineNear, 0.4, WORLD_H-GROUND_H);
}

function drawSkyline(L, factor, baseY) {
  const off = (R.bgX*factor) % L.len;
  for (let pass=0; pass<2; pass++) {
    const x = -off + pass*L.len;
    if (x > W || x + L.len < 0) continue;
    ctx.drawImage(L.c, x, baseY - L.hmax, L.len, L.hmax);
  }
}

function drawPipes() {
  const w = CFG.pipeW;
  for (const p of G.pipes) {
    const x = p.x - R.dist;
    if (x > W + 10 || x + w < -10) continue;
    const topH = p.gy - p.gap/2, botY = p.gy + p.gap/2;
    if (!p.c1) { p.c1 = `hsl(${p.hue},100%,65%)`; p.c2 = `hsl(${(p.hue+40)%360},90%,45%)`; }
    drawPillar(x, -20, w, topH+20, p, true);
    drawPillar(x, botY, w, WORLD_H-GROUND_H-botY, p, false);
  }
}
function capGrad(p) {   // cached per hue, defined in local cap space (0..capH)
  let g = Spr.capCache.get(p.hue);
  if (!g) { g = ctx.createLinearGradient(0,0,0,22); g.addColorStop(0,p.c1); g.addColorStop(1,p.c2); Spr.capCache.set(p.hue, g); }
  return g;
}
function drawPillar(x,y,w,h,p,isTop) {
  if (h <= 0) return;
  const c1 = p.c1;
  // body (cached gradient, drawn in local x space)
  ctx.save(); ctx.translate(x, 0); ctx.fillStyle = Spr.pillarBody;
  roundRect(0,y,w,h,12); ctx.fill(); ctx.restore();
  // neon outline (fake glow with layered strokes)
  ctx.strokeStyle = c1;
  ctx.globalAlpha = 0.18; ctx.lineWidth = 10; roundRect(x,y,w,h,12); ctx.stroke();
  ctx.globalAlpha = 0.35; ctx.lineWidth = 5; roundRect(x,y,w,h,12); ctx.stroke();
  ctx.globalAlpha = 1; ctx.lineWidth = 2.2; roundRect(x,y,w,h,12); ctx.stroke();
  // cap
  const capH = 22, capY = isTop ? y+h-capH : y;
  ctx.save(); ctx.translate(0, capY); ctx.fillStyle = capGrad(p); roundRect(x-6, 0, w+12, capH, 9); ctx.fill(); ctx.restore();
  ctx.fillStyle = 'rgba(255,255,255,.35)'; roundRect(x-2, capY+3, w+4, 5, 3); ctx.fill();
  // inner stripes
  ctx.fillStyle = c1; ctx.globalAlpha = 0.12;
  for (let sy = (isTop? y+h-capH-30 : y+capH+14); isTop ? sy > y : sy < y+h; sy += isTop ? -36 : 36) ctx.fillRect(x+10, sy, w-20, 4);
  ctx.globalAlpha = 1;
}
function roundRect(x,y,w,h,r) {
  r = Math.min(r, w/2, h/2);
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

function drawCoins() {
  for (const c of G.coins) {
    if (c.taken) continue;
    const cx = c.x - R.dist;
    if (cx > W + 30 || cx < -30) continue;
    const sx = Math.abs(Math.cos(c.t*3.2)) * 0.85 + 0.15, y = c.y + Math.sin(c.t*3)*4;
    ctx.drawImage(Spr.coinGlow.c, cx-26, y-26, 52, 52);
    ctx.save(); ctx.translate(cx,y); ctx.scale(sx,1);
    ctx.fillStyle = Spr.coinBody; ctx.beginPath(); ctx.arc(0,0,12,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(140,90,0,.7)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(0,0,8,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }
}

function drawGround() {
  const y = WORLD_H - GROUND_H;
  ctx.drawImage(groundLayer.c, 0, y, W, GROUND_H);
  // neon grid floor (moving perspective lines; horizon lines are baked)
  const gx = R.bgX % 40;
  ctx.strokeStyle = 'rgba(255,79,216,.55)'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let x = -gx - 40; x < W+40; x += 40) { ctx.moveTo(x, y); ctx.lineTo(W/2 + (x-W/2)*2.2, WORLD_H); }
  ctx.stroke();
  ctx.strokeStyle = '#5ef2ff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  ctx.strokeStyle = 'rgba(94,242,255,.25)'; ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  // ball shadow on ground
  const b = R.ball, h = (y - b.y - b.r);
  const k = Math.max(0.15, 1 - h/450);
  ctx.globalAlpha = 0.45*k; ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(b.x, y+6, b.r*1.2*k, b.r*0.28*k, 0, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
}

function drawTrail(alpha) {
  const skin = Skins.current, r = R.ball.r;
  if (!skin.rainbow) ctx.fillStyle = skin.trail;
  for (let i=0;i<G.trail.length;i++) {
    const t = G.trail[i], a = t.life/0.28;
    ctx.globalAlpha = a*0.28;
    if (skin.rainbow) ctx.fillStyle = `hsl(${((G.t*200 + i*20)%360)|0},100%,65%)`;
    ctx.beginPath(); ctx.arc(t.x - R.ts, t.y, r*(0.35+0.6*a), 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawParticles(alpha) {
  for (const p of G.particles) {
    ctx.globalAlpha = Math.max(0, p.life/p.max);
    ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(lerp(p.px,p.x,alpha), lerp(p.py,p.y,alpha), p.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* The glossy ball: radial shading, specular highlight, rim light,
   rotating subtle band (shows rolling), squash & stretch + tilt. */
function drawBall(c, b, skin, opts={}) {
  const r = b.r, time = opts.time ?? G.t;
  let mid = skin.mid, light = skin.light, dark = skin.dark, glow = skin.glow;
  if (skin.rainbow) { const h = (time*90)%360; mid = `hsl(${h},100%,60%)`; dark = `hsl(${(h+60)%360},90%,25%)`; glow = `hsl(${h},100%,70%)`; }
  // gradients are cached per skin+radius on the main canvas (rainbow skin animates, so never cached)
  const cacheable = c === ctx && !skin.rainbow && Spr.ballCache;
  const key = cacheable ? skin.id + '|' + r.toFixed(1) : null;
  let gc = cacheable ? Spr.ballCache.get(key) : null;
  if (!gc) {
    gc = {};
    gc.og = c.createRadialGradient(0,0,r*0.6,0,0,r*2.1);
    gc.og.addColorStop(0, hexA(glow,0.45)); gc.og.addColorStop(1, hexA(glow,0));
    gc.body = c.createRadialGradient(-r*0.35,-r*0.4,r*0.1, 0,0,r*1.05);
    gc.body.addColorStop(0, light); gc.body.addColorStop(0.35, mid); gc.body.addColorStop(1, dark);
    gc.rim = c.createRadialGradient(r*0.2,r*0.25,r*0.6, 0,0,r);
    gc.rim.addColorStop(0,'rgba(255,255,255,0)'); gc.rim.addColorStop(1, hexA(glow,0.55));
    gc.hl = c.createRadialGradient(-r*0.38,-r*0.45,0, -r*0.38,-r*0.45,r*0.5);
    gc.hl.addColorStop(0,'rgba(255,255,255,.95)'); gc.hl.addColorStop(0.4,'rgba(255,255,255,.35)'); gc.hl.addColorStop(1,'rgba(255,255,255,0)');
    if (cacheable) { if (Spr.ballCache.size > 40) Spr.ballCache.clear(); Spr.ballCache.set(key, gc); }
  }
  c.save();
  c.translate(b.x, b.y);
  // outer glow
  c.fillStyle = gc.og; c.beginPath(); c.arc(0,0,r*2.1,0,Math.PI*2); c.fill();
  // squash & stretch along velocity direction
  const s = b.squash || 0;
  const stretch = 1 + Math.min(0.12, Math.abs(b.vy)/6000) ;
  const sx = (1 + s*0.22) / stretch, sy = (1 - s*0.18) * stretch;
  c.rotate(b.tilt * 0.6);
  c.scale(sx, sy);
  // body
  c.fillStyle = gc.body; c.beginPath(); c.arc(0,0,r,0,Math.PI*2); c.fill();
  // rolling band (clipped), subtle
  c.save(); c.beginPath(); c.arc(0,0,r,0,Math.PI*2); c.clip();
  c.rotate(b.rot);
  c.fillStyle = 'rgba(255,255,255,.10)'; c.fillRect(-r, -r*0.18, r*2, r*0.36);
  c.fillStyle = 'rgba(0,0,0,.10)'; c.fillRect(-r*0.09, -r, r*0.18, r*2);
  if (skin.sparkle) { c.fillStyle='rgba(255,255,255,.9)'; for (let i=0;i<7;i++){ const a=i*2.4, d=r*(0.25+0.1*(i%4)); c.beginPath(); c.arc(Math.cos(a)*d, Math.sin(a)*d, 1.3+(i%2), 0, Math.PI*2); c.fill(); } }
  c.restore();
  // rim light (bottom-right)
  c.fillStyle = gc.rim; c.beginPath(); c.arc(0,0,r,0,Math.PI*2); c.fill();
  // specular highlight (fixed to light source: undo tilt)
  c.rotate(-b.tilt*0.6);
  c.fillStyle = gc.hl; c.beginPath(); c.ellipse(-r*0.36,-r*0.44, r*0.42, r*0.3, -0.6, 0, Math.PI*2); c.fill();
  c.fillStyle = 'rgba(255,255,255,.95)'; c.beginPath(); c.ellipse(-r*0.42,-r*0.5, r*0.12, r*0.07, -0.6, 0, Math.PI*2); c.fill();
  c.restore();
}
function hexA(col, a) {
  if (col.startsWith('hsl')) return col.replace('hsl','hsla').replace(')', `,${a})`);
  const n = parseInt(col.slice(1),16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;
}

const scoreCache = { n:-1, L:null, at:0 };
function drawScore() {
  if (scoreCache.n !== G.score) {
    const L = scoreCache.L && scoreCache.L.k === scale*dpr ? scoreCache.L : makeLayer(300, 110);
    L.k = scale*dpr; const c = L.x;
    c.clearRect(0,0,300,110);
    c.font = '900 64px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif';
    c.textAlign = 'center'; c.textBaseline = 'top';
    c.lineWidth = 8; c.strokeStyle = 'rgba(10,5,40,.75)'; c.strokeText(G.score, 150, 20);
    c.shadowColor = '#5ef2ff'; c.shadowBlur = 18; c.fillStyle = '#fff'; c.fillText(G.score, 150, 20);
    c.shadowBlur = 0;
    if (scoreCache.n >= 0 && G.score > 0) scoreCache.at = G.t;
    scoreCache.n = G.score; scoreCache.L = L;
  }
  const k = Math.max(0, 1 - (G.t - scoreCache.at) / 0.18), s = 1 + 0.16 * k * k;   // short pop on +1
  const w = 300*s, h = 110*s;
  ctx.drawImage(scoreCache.L.c, W/2 - w/2, 50 - (h-110)/2, w, h);
}

/* =========================================================
   UI (HTML overlays)
   ========================================================= */
const $ = id => document.getElementById(id);
const UI = {
  show(s) {
    $('menu').classList.toggle('hidden', s !== 'menu');
    $('over').classList.toggle('hidden', s !== 'over');
    $('shop').classList.toggle('hidden', s !== 'shop');
    $('menuBest').textContent = Store.data.best;
    if (s === 'shop') this.renderShop();
  },
  updateCoins() { $('coinCount').textContent = Store.data.coins; $('shopCoinCount').textContent = Store.data.coins; },
  showOver(score, best, isNew, coins) {
    $('overScore').textContent = score; $('overBest').textContent = best;
    $('newBest').classList.toggle('hidden', !isNew); $('newBest').style.display = isNew ? '' : 'none';
    $('overCoins').innerHTML = coins ? `+${coins} <span class="coin" style="vertical-align:-3px"></span> gesammelt` : '';
  },
  updateMute() { $('muteBtn').textContent = Store.data.muted ? '🔇' : '🔊'; },
  toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(this._tt); this._tt = setTimeout(()=>t.classList.remove('show'), 1800); },
  renderShop() {
    const grid = $('skinGrid'); grid.innerHTML = '';
    for (const skin of SKINS) {
      const owned = Skins.owns(skin.id), sel = Store.data.skin === skin.id;
      const el = document.createElement('button');
      el.className = 'skin' + (sel ? ' selected' : '') + (!owned ? ' locked' : '');
      const cv = document.createElement('canvas'); cv.width = 128; cv.height = 128;
      const cc = cv.getContext('2d'); cc.scale(2,2);
      drawBall(cc, { x:32, y:32, r:17, vy:0, rot:0.5, tilt:0, squash:0 }, skin, { time: 1 });
      el.appendChild(cv);
      const name = document.createElement('div'); name.className = 'name'; name.textContent = skin.name; el.appendChild(name);
      const info = document.createElement('div'); info.className = 'price';
      if (sel) info.textContent = '✓ Ausgewählt';
      else if (owned) info.textContent = 'Auswählen';
      else if (skin.type === 'premium') info.innerHTML = '<span class="soon">Bald verfügbar</span>';
      else info.innerHTML = `<span class="coin"></span>${skin.price}`;
      el.appendChild(info);
      el.addEventListener('click', async (e) => {
        e.stopPropagation();
        const res = await Skins.acquire(skin);
        if (res === 'insufficient') this.toast(`Nicht genug Münzen (${skin.price - Store.data.coins} fehlen)`);
        else if (res === 'soon') this.toast('Premium-Skins kommen bald!');
        else if (res === 'bought') { this.toast(`${skin.name} freigeschaltet!`); Sound.coin(); }
        else if (res === 'failed') this.toast('Kauf fehlgeschlagen');
        this.renderShop();
      });
      grid.appendChild(el);
    }
  }
};

/* =========================================================
   INPUT
   ========================================================= */
function onPress(e) {
  if (e.target.closest && e.target.closest('button, #shop')) return;
  if (e.cancelable) e.preventDefault();
  Sound.unlock();
  if (G.state === 'menu') startGame();
  else if (G.state === 'play') flap();
  else if (G.state === 'over' && performance.now() - G.overAt > 900) startGame();
}
stage.addEventListener('pointerdown', onPress, { passive:false });
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); if (e.repeat) return; onPress({ target: document.body }); }
});
// prevent scroll / zoom / double-tap zoom
document.addEventListener('touchmove', e => { if (!e.target.closest('#skinGrid')) e.preventDefault(); }, { passive:false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());

$('shopBtn').addEventListener('click', e => { e.stopPropagation(); Sound.unlock(); setState('shop'); });
$('overShopBtn').addEventListener('click', e => { e.stopPropagation(); setState('shop'); });
$('shopBack').addEventListener('click', e => { e.stopPropagation(); setState('menu'); });
$('againBtn').addEventListener('click', e => { e.stopPropagation(); Sound.unlock(); startGame(); });
$('muteBtn').addEventListener('click', e => {
  e.stopPropagation(); Sound.unlock(); Store.data.muted = !Store.data.muted; Store.save(); UI.updateMute();
  if (!Store.data.muted) Sound.coin();
});

/* =========================================================
   LOOP (delta-time, clamped; pauses when tab hidden)
   ========================================================= */
/* Fixed 120 Hz simulation + interpolated rendering: the game plays identically
   on 60/90/120/144 Hz screens and motion stays smooth when frames vary. */
let last = -1, acc = 0;
const perf = { sum:0, n:0, checks:0 };
function frame(now) {
  requestAnimationFrame(frame);
  if (last < 0) last = now;
  let dt = (now - last) / 1000; last = now;
  if (dt < 0) dt = 0;
  if (dt > CFG.maxFrameDt) dt = CFG.maxFrameDt;
  acc += dt;
  let steps = 0;
  while (acc >= CFG.step && steps < 8) { snapshot(); update(CFG.step); acc -= CFG.step; steps++; }
  if (steps === 8) acc = 0;
  render(acc / CFG.step);
  // adaptive resolution: if a phone can't hold ~40 fps while playing, step DPR down (max twice)
  if (G.state === 'play' && dt > 0) {
    perf.sum += dt; perf.n++;
    if (perf.n >= 120) {
      if (perf.sum / perf.n > 1/40 && dpr > CFG.dprMin && perf.checks < 2) { dprLimit = Math.max(CFG.dprMin, dpr - 0.5); perf.checks++; resize(); }
      perf.sum = 0; perf.n = 0;
    }
  }
}
document.addEventListener('visibilitychange', () => { last = -1; acc = 0; });
window.addEventListener('resize', () => { resize(); if (G.state !== 'play') resetRun(); });
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

resize(); resetRun(); UI.updateCoins(); UI.updateMute(); setState('menu');
requestAnimationFrame(frame);
window.__nitebop = { G, CFG, Store, Skins, Wallet, startGame, flap, render, pipeScreenX: p => p.x - G.dist, BUILD: CFG.BUILD };  // debug/testing hook
document.documentElement.dataset.build = CFG.BUILD;

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
